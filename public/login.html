<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Portfolio Manager</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), var(--shadow-glow);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-brand-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem auto;
      font-size: 1.8rem;
      color: #fff;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand-icon">
          <i class="fas fa-user-shield"></i>
        </div>
        <h2 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 0.4rem;">
          Portfolio <span class="gradient-text">Admin</span>
        </h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
          Authenticate to manage projects, skills & profile
        </p>
      </div>

      <div id="loginFeedback" class="form-feedback"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username" class="form-label">Email / Username</label>
          <div style="position: relative;">
            <input type="text" id="username" class="form-input" placeholder="Enter email or username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%; margin-top: 1rem;">
          <i class="fas fa-right-to-bracket"></i> Sign In to Dashboard
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem;">
        <a href="/index.html" style="color: var(--text-muted); font-size: 0.9rem;">
          <i class="fas fa-arrow-left"></i> Return to Live Portfolio
        </a>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="/js/firebase-config.js"></script>

  <script>
    const form = document.getElementById('adminLoginForm');
    const feedback = document.getElementById('loginFeedback');
    const loginBtn = document.getElementById('loginBtn');

    // If already logged in, redirect directly to admin.html
    if (sessionStorage.getItem('admin_auth') === 'true') {
      window.location.href = '/admin.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      feedback.className = 'form-feedback';
      feedback.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      let authenticated = false;

      // 1. Try Firebase Authentication first
      if (typeof firebase !== 'undefined' && firebase.auth) {
        try {
          await firebase.auth().signInWithEmailAndPassword(username, password);
          authenticated = true;
        } catch (fbErr) {
          // If user not created in Firebase Auth yet, check against authorized admin credentials
          if (username.toLowerCase() === 'seenukumar9345@gmail.com' && password === 'seenukumar') {
            try {
              // Try creating the user in Firebase Auth so next time it is synced
              await firebase.auth().createUserWithEmailAndPassword(username, password).catch(() => {});
            } catch (e) {}
            authenticated = true;
          }
        }
      }

      // 2. Direct Admin Credential verification
      if (!authenticated && username.toLowerCase() === 'seenukumar9345@gmail.com' && password === 'seenukumar') {
        authenticated = true;
      }

      // 3. Optional local backend check if running on local server
      if (!authenticated) {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (data.success) authenticated = true;
        } catch (e) {}
      }

      if (authenticated) {
        sessionStorage.setItem('admin_auth', 'true');
        sessionStorage.setItem('admin_user', username);
        feedback.textContent = 'Login successful! Redirecting to dashboard...';
        feedback.className = 'form-feedback success';
        feedback.style.display = 'block';
        setTimeout(() => {
          window.location.href = '/admin.html';
        }, 800);
      } else {
        feedback.textContent = 'Invalid email or password.';
        feedback.className = 'form-feedback error';
        feedback.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>

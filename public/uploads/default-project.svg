<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#cardGrad)" />
  <circle cx="100" cy="80" r="140" fill="#6366f1" opacity="0.08" filter="blur(40px)" />
  <circle cx="500" cy="280" r="160" fill="#8b5cf6" opacity="0.1" filter="blur(40px)" />
  
  <!-- Subtle Grid Lines -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#334155" stroke-width="0.5" opacity="0.3" />
  <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360" stroke="#334155" stroke-width="0.5" opacity="0.3" />

  <!-- Code Window Outline -->
  <rect x="80" y="50" width="440" height="260" rx="16" fill="#090d16" stroke="url(#glowGrad)" stroke-width="2" opacity="0.9" />
  
  <!-- Window Header Dots -->
  <circle cx="110" cy="75" r="5" fill="#ef4444" />
  <circle cx="126" cy="75" r="5" fill="#f59e0b" />
  <circle cx="142" cy="75" r="5" fill="#10b981" />
  
  <!-- Code Icon Symbol -->
  <path d="M260 160 L220 190 L260 220" stroke="#818cf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M340 160 L380 190 L340 220" stroke="#c084fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M310 150 L290 230" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" />

  <text x="300" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">PROJECT SHOWCASE</text>
</svg>
